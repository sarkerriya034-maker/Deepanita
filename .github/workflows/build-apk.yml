name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect the active Java major version."
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Detected: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR (>= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing existing file."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be verified."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files in app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK ($EXPECTED_APK) is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have a .apk extension."
              exit 1
              ;;
          esac

          echo "APK successfully verified:"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset-temp"
          mkdir -p "$TEMP_ASSET_DIR"

          REPO_NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="$TEMP_ASSET_DIR/$ASSET_FILENAME"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset ($ASSET_PATH) is missing or empty."
            exit 1
          fi

          echo "Prepared APK release asset: $ASSET_PATH ($ASSET_FILENAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ### Automated Debug APK Build

          This is an automatically generated debug APK build created by GitHub Actions.

          - **Build Run Number:** ${{ github.run_number }}
          - **Build Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Build Type:** Debug (signed with a temporary debug keystore)
          - **Intended Use:** Testing and development verification only. Not a Play Store production release.

          Download the attached `.apk` file below directly to install and test on an Android device.
          EOF

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "### 🚀 Debug APK Available for Download"
              echo ""
              echo "The debug APK was built and published to GitHub Releases:"
              echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Direct Asset:** \`$ASSET_NAME\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section of the release page onto your Android device."
              echo ""
              echo "> **Backup:** The standard GitHub Actions workflow artifact named \`app-debug-apk\` is also available on the Actions run summary page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing could not be completed. The debug APK build itself succeeded, and the Actions artifact remains available."
            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Notice)"
              echo ""
              echo "The debug APK was built successfully and uploaded as a GitHub Actions workflow artifact."
              echo ""
              echo "- **Actions Artifact Name:** \`app-debug-apk\`"
              echo "- **Download Location:** You can download the APK from the **Artifacts** section at the bottom of this Actions workflow run page."
              echo ""
              echo "> Note: Direct GitHub Release publication was skipped or encountered a permission/network limitation, but the build artifact is fully intact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
